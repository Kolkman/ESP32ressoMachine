<!DOCTYPE HTML>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />


  <link rel="stylesheet" type="text/css" href="ESPresso.css" media="all" />
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  <style>
    .networkSetupFooter {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
    }

    .networkSetupFooter .footerRightAction {
      margin-left: auto;
    }

    .networkSetupFooter hr {
      flex-basis: 100%;
      width: 100%;
    }
  </style>
  <script>
    const url = "";  // Setting in production.
    //const url = "http://192.168.179.109/";  // This is for development purposes only


  </script>
  <script src="networkConfigPage.js"></script>
</head>


<body>

  <h1>Network Configuration</h1>

  <div id="bodyBlock">
    <div id="wifiEnableBlock" class="configblock" style="display:none">
      <div class="tableTable">
        <div class="tableBody">
          <div id="wifiEnablePortalRow" class="tableRow" style="display:none">
            <div class="mqttLabel tableField"><label for="wifiEnable">Enable WiFi</label></div>
            <div class="tableField mqttInput">
              <input type="hidden" name="wifiEnable" value="false" form="networkSetupForm">
              <input id="wifiEnable" name="wifiEnable" type="checkbox" value="true" onchange="toggleWifiSections(this.checked)" form="networkSetupForm">
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="temperatureSettings" class="configblock">
      <div class="tableTable">
        <div class="tableBody">
          <div class="tableRow">
            <div class="mqttLabel tableField"><label for="tset">Default Temperature</label></div>
            <div class="tableField mqttInput">
              <input id="tset" name="tset" type="number" min="0" max="110" step="0.1" placeholder="Default Temperature" form="networkSetupForm">
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="networkSetupDetails">
    <div class="configblock">
      <div id="loadingblock">
        <div id="loading"></div>
      </div>
      <div id="wifiNetTable">
        <div id="scantable"> </div>
        <div><button class="btn" onClick="UpdateScanTable()">Rescan</button></div>

      </div>
    </div>
    <div class="configblock">
      <form id="networkSetupForm" method="get" action="api/v1/set">
        <div id="wifiSettings">
          <div class="tableTable">
            <div id="selectedNetworks" class="tableBody"></div>
          </div>
        </div>



        <div id="MQTTSettings">
          <div id="mqttTable" class="tableTable">
            <div class="tableBody">
              <div class="tableRow ">
                <div class="mqttLabel tableField"><label for="mqttEnable">Enable MQTT</label></div>
                <div class="tableField mqttInput">
                  <input type="hidden" name="mqttEnable" value="false">
                  <input id="mqttEnable" name="mqttEnable" type="checkbox" value="true" onchange="toggleMqttFields(this.checked)">
                </div>
              </div>
              <div class="tableRow ">
                <div class="mqttLabel tableField"><label for="mqttHost">MQTT Server</label></div>
                <div class="tableField mqttInput">
                  <input id="mqttHost" name="mqttHost" length="2" placeholder="MQTT Server" value="mqtt.example.net">
                </div>
              </div>
              <div class="tableRow ">
                <div class="mqttLabel tableField"><label for="mqttPort">MQTT Port</label></div>
                <div class="tableField mqttInput">
                  <input id="mqttPort" name="mqttPort" length="6" placeholder="MQTT Port" value="1883">
                </div>
              </div>
              <div class="tableRow ">
                <div class="mqttLabel tableField"><label for="mqttTopic">MQTT Topic</label></div>
                <div class="tableField mqttInput">
                  <input id="mqttTopic" name="mqttTopic" length="2" placeholder="MQTT Topic" value="Espresso">
                </div>
              </div>
              <div class="tableRow ">
                <div class="mqttLabel tableField"><label for="mqttUser">MQTT User</label></div>
                <div class="tableField mqttInput">
                  <input id="mqttUser" name="mqttUser" length="6" placeholder="MQTT User" value="user">
                </div>
              </div>
              <div class="tableRow ">
                <div class="mqttLabel tableField"><label for="mqttPass">MQTT Passwd</label></div>
                <div class="tableField mqttInput">
                  <input id="mqttPass" name="mqttPass" length="6" placeholder="MQTT Password" value="password">
                </div>
              </div>
            </div>
          </div>
        </div>
        <input type="hiden" style="display:none;" name="safeandrestart" value="true" >
      </form>
    </div>
    </div>
  </div>
  <div class="footermaterial networkSetupFooter">
    <a href="./exitconfig"><button class="btn">Exit</button></a>
    <button class="btn footerRightAction" type="submit" form="networkSetupForm">Save</button>
    <hr />
</div>
</body>
